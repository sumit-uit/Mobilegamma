name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cakesync-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Download test photos
        run: python3 .github/scripts/fetch_test_images.py test-images

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator_test.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            emulator-output/
            test-images/

      # Publishes the screenshots to the "emulator-screenshots" branch so they can be
      # viewed on GitHub (and fetched with git) without downloading the artifact.
      - name: Publish screenshots to branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -d emulator-output ] || exit 0
          mkdir -p /tmp/shots && cp -r emulator-output/. /tmp/shots/ && rm -f /tmp/shots/photos.db*
          cd /tmp/shots
          {
            echo "# Emulator run for ${GITHUB_SHA::7}"
            echo
            echo '```'; cat result.txt labels.txt 2>/dev/null; echo '```'
            for f in *.png; do echo; echo "## $f"; echo "![]($f)"; done
          } > README.md
          git init -q -b emulator-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Emulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-screenshots
