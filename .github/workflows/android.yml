name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore shared signing key
        env:
          KEYSTORE_B64: ${{ secrets.CAKESYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/cakesync.jks
          else
            echo "::warning::CAKESYNC_KEYSTORE_BASE64 secret not set - APK is signed with a temporary debug key, so Google Drive sign-in won't work"
          fi

      - name: Build debug APK
        env:
          CAKESYNC_KEYSTORE_PASSWORD: ${{ secrets.CAKESYNC_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-1|DN"

      - uses: actions/upload-artifact@v4
        with:
          name: cakesync-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Direct phone download: https://github.com/<repo>/releases/latest/download/CakeSync.apk
      - name: Publish APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk CakeSync.apk
          cp app/build/outputs/apk/debug/app-debug.apk "CakeSync-v${VERSION}.apk"
          NOTES="Version ${VERSION} (commit ${GITHUB_SHA::7}). On your phone, download CakeSync.apk (or the same file named with its version) and open it to install. The version is shown next to the app name."
          # GitHub's release API occasionally returns 5xx; retry the whole publish a few times.
          for attempt in 1 2 3 4; do
            gh release delete latest --yes --cleanup-tag || true
            if gh release create latest CakeSync.apk "CakeSync-v${VERSION}.apk" \
                --target "$GITHUB_SHA" --title "CakeSync v${VERSION}" --notes "$NOTES"; then
              exit 0
            fi
            echo "Release publish failed (attempt $attempt), retrying..."
            sleep $((attempt * 15))
          done
          exit 1

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore shared signing key
        env:
          KEYSTORE_B64: ${{ secrets.CAKESYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/cakesync.jks
          else
            echo "::warning::CAKESYNC_KEYSTORE_BASE64 secret not set - APK is signed with a temporary debug key, so Google Drive sign-in won't work"
          fi

      - name: Build debug APK
        env:
          CAKESYNC_KEYSTORE_PASSWORD: ${{ secrets.CAKESYNC_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Download test photos
        run: |
          python3 .github/scripts/fetch_test_images.py test-images
          pip install --quiet pillow
          python3 .github/scripts/make_composites.py test-images
          # short test videos: one of a cake, one of a non-cake scene
          mkdir -p test-videos
          other=$(ls test-images/other_*.jpg | head -1)
          [ -f video-src/cake.jpg ] && ffmpeg -y -loglevel error -loop 1 -i video-src/cake.jpg -t 4 -r 10 \
            -vf "scale=640:-2,format=yuv420p" -c:v libx264 test-videos/zz_cake_video.mp4 || true
          ffmpeg -y -loglevel error -loop 1 -i "$other" -t 4 -r 10 \
            -vf "scale=640:-2,format=yuv420p" -c:v libx264 test-videos/zz_other_video.mp4 || true
          ls -l test-videos

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator_test.sh

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: |
            emulator-output/
            test-images/
            test-videos/

      # Publishes the screenshots to the "emulator-screenshots" branch so they can be
      # viewed on GitHub (and fetched with git) without downloading the artifact.
      - name: Publish screenshots to branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          [ -d emulator-output ] || exit 0
          mkdir -p /tmp/shots && cp -r emulator-output/. /tmp/shots/ && rm -f /tmp/shots/photos.db*
          cd /tmp/shots
          {
            echo "# Emulator run for ${GITHUB_SHA::7}"
            echo
            echo '```'; cat result.txt labels.txt people_checks.txt 2>/dev/null || true; echo '```'
            for f in *.png; do [ -e "$f" ] || continue; echo; echo "## $f"; echo "![]($f)"; done
          } > README.md
          git init -q -b emulator-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Emulator screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-screenshots
