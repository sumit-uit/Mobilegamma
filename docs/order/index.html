<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- Privacy: this page may not load or send anything. What the customer types leaves the phone
     only when they tap Send, straight to the bakery's WhatsApp, email or chat. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Cake order form</title>
<meta name="description" content="Order a cake: pick a size, flavour and date, then send it to the bakery.">
<style>
:root {
  --bg: #fff8f7; --card: #ffffff; --ink: #2a1a1f; --muted: #6f5a60; --line: #ecd9dd;
  --brand: #b83b5e; --brand-ink: #ffffff; --soft: #ffd9e2; --soft-ink: #3e0020; --ok: #1f7a4d; --warn: #9a3412;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1114; --card: #261a1e; --ink: #f6e9ec; --muted: #c3aab1; --line: #43303a;
    --brand: #ffb1c5; --brand-ink: #5c1130; --soft: #5c1a36; --soft-ink: #ffd9e2; --ok: #7ad3a4; --warn: #fdba74;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 150px; }
header { padding: 20px 4px 8px; }
header .kicker { color: var(--brand); font-weight: 600; font-size: 14px; letter-spacing: .02em; }
header h1 { font-family: Georgia, "Times New Roman", serif; font-size: 30px; line-height: 1.15; margin: 4px 0 6px; }
header p { margin: 0; color: var(--muted); }
section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 14px 0; }
section h2 { font-size: 17px; margin: 0 0 12px; }
label.field { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
label.field .hint { font-weight: 400; color: var(--muted); }
input[type=text], input[type=tel], input[type=date], input[type=time], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px;
}
textarea { min-height: 72px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px;
  padding: 9px 14px; font: inherit; font-size: 15px; cursor: pointer; min-height: 44px; text-align: left;
}
.chip small { display: block; color: var(--muted); font-size: 12px; }
.chip[aria-pressed=true] { background: var(--soft); color: var(--soft-ink); border-color: var(--brand); }
.chip[aria-pressed=true] small { color: inherit; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.estimate { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); color: var(--soft-ink); }
.estimate strong { font-size: 22px; }
.estimate span { font-size: 13px; }
.policy { list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 14px; }
.policy li { padding: 3px 0; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { color: var(--brand); text-decoration: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.send {
  position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
}
.send .inner { max-width: 560px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; }
.btn { flex: 1 1 0; border: 0; border-radius: 999px; padding: 10px 8px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 44px; white-space: nowrap; }
.btn.primary { flex-basis: 100%; padding: 14px 18px; font-size: 16px; min-height: 50px; background: var(--brand); color: var(--brand-ink); }
.btn.secondary { background: var(--soft); color: var(--soft-ink); }
.error { color: var(--warn); font-size: 14px; margin: 6px 0 0; min-height: 1em; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty { text-align: center; padding: 60px 16px; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app">
  <div class="empty" id="loading">Loading the order form…</div>
</main>
<div class="send" id="sendbar" hidden><div class="inner" id="sendbtns"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// The form's settings come from the link (#z + compressed JSON), made by the CakeSync app.
// Nothing typed here leaves the phone until the customer taps Send.
const QUESTIONS = [
  ["occasion", "Occasion", "🎉"],
  ["message", "Message on cake", "✍️"],
  ["eggless", "Eggless", "🥚"],
  ["allergies", "Allergies", "⚠️"],
  ["time", "Pickup / delivery time", "⏰"],
  ["delivery", "Pickup or delivery (address)", "🚗"],
];
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : String(kid));
  return e;
};

async function readConfig() {
  const hash = location.hash.slice(1);
  if (!hash) return null;
  const kind = hash[0], data = hash.slice(1);
  const bytes = Uint8Array.from(atob(data.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((data.length + 3) % 4)), c => c.charCodeAt(0));
  if (kind === "j") return JSON.parse(new TextDecoder().decode(bytes));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function money(n, cur) {
  if (n == null || isNaN(n)) return "";
  const whole = Math.round(n);
  const indian = ["₹", "Rs", "Rs.", "INR"].includes((cur || "").trim());
  const s = whole.toLocaleString(indian ? "en-IN" : "en-US");
  const c = cur || "$";
  return c + (c.length > 1 && /[A-Za-z.]$/.test(c) ? " " : "") + s;
}
const percentOf = price => { const m = /(\d+(?:\.\d+)?)\s*%/.exec(price || ""); return m ? parseFloat(m[1]) : null; };
const amountOf = price => { if (percentOf(price) != null) return null; const m = /(\d+(?:\.\d+)?)/.exec(price || ""); return m ? parseFloat(m[1]) : null; };
const webUrl = s => !s ? null : /^https?:/i.test(s) ? s : "https://" + s;
const igUrl = h => !h ? null : /^https?:/i.test(h) ? h : "https://instagram.com/" + h.replace(/^@/, "");
const fbUrl = p => !p ? null : /^https?:/i.test(p) ? p : "https://facebook.com/" + p.replace(/\s+/g, "");
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
function prettyTime(hhmm) {
  let [h, m] = hhmm.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, "0")} ${ampm}`;
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

function chipGroup(options, state, key, onChange) {
  const box = el("div", { class: "chips", role: "group" });
  const render = () => {
    box.replaceChildren(...options().map(o => el("button", {
      type: "button", class: "chip", "aria-pressed": String(state[key] === o.value), disabled: o.disabled,
      onclick: () => { state[key] = state[key] === o.value && o.toggle ? null : o.value; render(); onChange(); },
    }, o.label, o.sub ? el("small", {}, o.sub) : null)));
  };
  box.render = render;
  render();
  return box;
}

function start(cfg) {
  const cur = cfg.c || "$";
  const asks = new Set(cfg.q || []);
  const tables = cfg.t || [];
  const levels = cfg.l || [];
  const eggExtra = (cfg.x || []).find(([n]) => /eggless/i.test(n));
  const extras = (cfg.x || []).filter(x => !(asks.has("eggless") && x === eggExtra));
  const state = { table: tables.length ? 0 : null, size: null, flavour: null, level: levels.length ? levels[0][0] : null, extras: new Set(), eggless: false, delivery: false };
  const business = cfg.b || "";
  document.title = business ? `Order a cake · ${business}` : "Cake order form";

  const app = $("#app");
  app.replaceChildren();
  app.append(el("header", {},
    el("div", { class: "kicker" }, "🎂 Cake order form"),
    el("h1", {}, business || "Order a cake"),
    el("p", {}, "Pick your cake and date, then tap Send. We'll confirm the price and details with you."),
  ));

  // --- You
  const name = el("input", { type: "text", id: "name", autocomplete: "name", required: true });
  const phone = el("input", { type: "tel", id: "phone", autocomplete: "tel", required: true });
  app.append(el("section", {}, el("h2", {}, "Your details"),
    el("label", { class: "field", for: "name" }, "Name"), name,
    el("label", { class: "field", for: "phone" }, "Phone"), phone,
  ));

  // --- Cake
  const cake = el("section", {}, el("h2", {}, "Your cake"));
  const design = el("input", { type: "text", id: "design", value: cfg.d || "", placeholder: "e.g. Pink floral, unicorn, a photo you like" });
  cake.append(el("label", { class: "field", for: "design" }, "Design ", el("span", { class: "hint" }, "(optional)")), design);
  const estimate = el("div", { class: "estimate", hidden: true });
  const update = () => {
    sizes && sizes.render(); flavours && flavours.render();
    const total = price();
    estimate.hidden = total == null;
    if (total != null) estimate.replaceChildren(el("div", {}, el("span", {}, "Estimated price"), el("br"), el("strong", {}, money(total, cur))), el("span", {}, "Final price confirmed by " + (business || "the bakery")));
  };
  let sizes = null, flavours = null;
  if (tables.length) {
    if (tables.length > 1) {
      cake.append(el("label", { class: "field" }, "What would you like?"),
        chipGroup(() => tables.map((t, i) => ({ value: i, label: t.n })), state, "table", () => { state.size = null; state.flavour = null; update(); }));
    }
    const table = () => tables[state.table] || { s: [], f: [] };
    const sizeIdx = () => table().s.findIndex(s => s[0] === state.size);
    sizes = chipGroup(() => table().s.map(([label, serves]) => ({ value: label, label, sub: serves || null })), state, "size", update);
    flavours = chipGroup(() => table().f.map(([n, ...prices]) => {
      const i = sizeIdx();
      const p = i >= 0 ? prices[i] : Math.min(...prices.filter(x => x != null));
      const offered = i < 0 || prices[i] != null;
      return { value: n, label: n, sub: offered && isFinite(p) ? (i >= 0 ? money(p, cur) : "from " + money(p, cur)) : (offered ? null : "not in this size"), disabled: !offered };
    }), state, "flavour", update);
    cake.append(el("label", { class: "field" }, "Size"), sizes, el("label", { class: "field" }, "Flavour"), flavours);
  } else {
    const size = el("input", { type: "text", id: "size", placeholder: 'e.g. 8" round' });
    const flav = el("input", { type: "text", id: "flavour", placeholder: "e.g. Vanilla" });
    size.addEventListener("input", () => state.size = size.value.trim());
    flav.addEventListener("input", () => state.flavour = flav.value.trim());
    cake.append(el("div", { class: "row" },
      el("div", {}, el("label", { class: "field", for: "size" }, "Size"), size),
      el("div", {}, el("label", { class: "field", for: "flavour" }, "Flavour"), flav)));
  }
  if (levels.length > 1) {
    cake.append(el("label", { class: "field" }, "Style"),
      chipGroup(() => levels.map(([n, from]) => ({ value: n, label: n, sub: from != null ? "from " + money(from, cur) : null })), state, "level", update));
  }
  if (asks.has("eggless")) {
    cake.append(el("label", { class: "field" }, "Eggless?" + (eggExtra ? ` (${eggExtra[1]})` : "")),
      chipGroup(() => [{ value: false, label: "No" }, { value: true, label: "Yes, eggless" }], state, "eggless", update));
  }
  if (extras.length) {
    const box = el("div", { class: "chips" });
    const renderExtras = () => box.replaceChildren(...extras.map(([n, p]) => el("button", {
      type: "button", class: "chip", "aria-pressed": String(state.extras.has(n)),
      onclick: () => { state.extras.has(n) ? state.extras.delete(n) : state.extras.add(n); renderExtras(); update(); },
    }, n, p ? el("small", {}, p) : null)));
    renderExtras();
    cake.append(el("label", { class: "field" }, "Extras ", el("span", { class: "hint" }, "(optional)")), box);
  }
  cake.append(estimate);
  app.append(cake);

  function price() {
    const t = tables[state.table];
    if (!t || !state.size || !state.flavour) return null;
    const i = t.s.findIndex(s => s[0] === state.size);
    const row = t.f.find(f => f[0] === state.flavour);
    let base = row && i >= 0 ? row[1 + i] : null;
    const lvl = levels.find(l => l[0] === state.level);
    if (lvl && lvl[1] != null) base = base == null ? lvl[1] : Math.max(base, lvl[1]);
    if (base == null) return null;
    const chosen = extras.filter(([n]) => state.extras.has(n)).map(x => x[1]);
    if (state.eggless && eggExtra) chosen.push(eggExtra[1]);
    const pct = chosen.map(percentOf).filter(x => x != null).reduce((a, b) => a + b, 0);
    const fixed = chosen.map(amountOf).filter(x => x != null).reduce((a, b) => a + b, 0);
    return base * (1 + pct / 100) + fixed;
  }

  // --- Details
  const details = el("section", {}, el("h2", {}, "Details"));
  const answers = {};
  const text = (id, label, placeholder, area) => {
    const input = el(area ? "textarea" : "input", { type: area ? null : "text", id, placeholder: placeholder || null });
    answers[id] = input;
    details.append(el("label", { class: "field", for: id }, label), input);
  };
  if (asks.has("occasion")) text("occasion", "Occasion", "Birthday, anniversary, baby shower…");
  if (asks.has("message")) text("message", "Message on the cake", "e.g. Happy 5th Birthday Aarav");
  if (asks.has("allergies")) text("allergies", "Allergies", "Nuts, gluten… or none");
  (cfg.cq || []).forEach((q, i) => text("cq" + i, q, ""));
  text("notes", "Anything else? (optional)", "Colours, theme, number of guests…", true);
  if (asks.has("reference")) details.append(el("p", { class: "note" }, "📷 Have a picture of a cake you like? Attach it in the chat after you send this."));
  app.append(details);

  // --- When
  const when = el("section", {}, el("h2", {}, "When"));
  const min = new Date(); min.setDate(min.getDate() + (cfg.lead || 0));
  const date = el("input", { type: "date", id: "date", min: isoDate(min), required: true });
  when.append(el("label", { class: "field", for: "date" }, "Date needed ", cfg.lead ? el("span", { class: "hint" }, `(at least ${cfg.lead} day${cfg.lead > 1 ? "s" : ""}' notice)`) : null), date);
  let time = null;
  if (asks.has("time")) {
    time = el("input", { type: "time", id: "time", step: 900 });
    when.append(el("label", { class: "field", for: "time" }, cfg.del ? "Pickup / delivery time" : "Pickup time"), time);
  }
  const address = el("input", { type: "text", id: "address", autocomplete: "street-address", placeholder: "Street, city" });
  const addressBox = el("div", { hidden: true }, el("label", { class: "field", for: "address" }, "Delivery address"), address);
  if (cfg.del && asks.has("delivery")) {
    when.append(el("label", { class: "field" }, "Pickup or delivery?"),
      chipGroup(() => [{ value: false, label: "Pickup" }, { value: true, label: "Delivery", sub: cfg.df || null }], state, "delivery", () => { addressBox.hidden = !state.delivery; }),
      addressBox);
  }
  app.append(when);

  // --- Policies and links
  const policy = [];
  if (cfg.adv) policy.push(`💳 ${cfg.adv}% advance to confirm${cfg.pay ? " · " + cfg.pay : ""}`);
  else if (cfg.pay) policy.push("💳 " + cfg.pay);
  if (cfg.cancel) policy.push(`↩️ Free cancellation up to ${cfg.cancel} day${cfg.cancel > 1 ? "s" : ""} before`);
  if (cfg.del && cfg.df) policy.push("🚗 Delivery: " + cfg.df);
  if (policy.length) app.append(el("section", {}, el("h2", {}, "Good to know"), el("ul", { class: "policy" }, policy.map(p => el("li", {}, p)))));
  const links = [
    [webUrl(cfg.book), "📅 Book a time"], [webUrl(cfg.menu), "📋 Menu"], [igUrl(cfg.ig), "📷 Instagram"],
    [fbUrl(cfg.fb), "👍 Facebook"], [webUrl(cfg.web), "🌐 Website"],
  ].filter(([u]) => u);
  if (links.length) app.append(el("section", {}, el("h2", {}, "More from " + (business || "us")), el("div", { class: "links" }, links.map(([u, t]) => el("a", { href: u, target: "_blank", rel: "noopener" }, t)))));
  const error = el("p", { class: "error", role: "alert" });
  app.append(error, el("footer", {}, "Your details go only to " + (business || "the bakery") + ", in the message you send."));

  // --- The message, in the "Label: value" lines the CakeSync app reads back.
  function message() {
    const lines = [`Hi ${business || "there"}! I'd like to order a cake:`];
    const add = (emoji, label, value) => lines.push(`${emoji} ${label}: ${value || ""}`.trimEnd());
    const t = tables[state.table];
    add("🙋", "Name", name.value.trim());
    add("📞", "Phone", phone.value.trim());
    add("🎂", "Design", design.value.trim());
    add("📏", "Size", state.size || "");
    add("🍰", "Flavour", state.flavour || "");
    for (const [key, label, emoji] of QUESTIONS) {
      if (!asks.has(key)) continue;
      if (key === "eggless") add(emoji, label, state.eggless ? "Yes" : "No");
      else if (key === "time") add(emoji, label, time && time.value ? prettyTime(time.value) : "");
      else if (key === "delivery") add(emoji, label, state.delivery ? "Delivery to " + address.value.trim() : "Pickup");
      else add(emoji, label, answers[key] ? answers[key].value.trim() : "");
    }
    add("📅", "Date needed", date.value ? `${date.value} (${prettyDate(date.value)})` : "");
    (cfg.cq || []).forEach((q, i) => add("❓", q, answers["cq" + i].value.trim()));
    if (levels.length > 1 && state.level) add("🎨", "Style", state.level);
    if (state.extras.size) add("➕", "Extras", [...state.extras].join(", "));
    if (tables.length > 1 && t) add("📋", "Cake type", t.n);
    const total = price();
    if (total != null) add("💰", "Estimate", money(total, cur));
    const notes = answers.notes.value.trim();
    if (notes) add("📝", "Notes", notes.replace(/\n+/g, " "));
    if (asks.has("reference")) lines.push("📷 (I'll attach a reference photo)");
    return lines.join("\n");
  }
  function check() {
    const missing = [];
    if (!name.value.trim()) missing.push("your name");
    if (!phone.value.trim()) missing.push("your phone");
    if (!date.value) missing.push("the date");
    else if (date.value < isoDate(min)) missing.push(`a date from ${prettyDate(isoDate(min))}`);
    if (state.delivery && !address.value.trim()) missing.push("the delivery address");
    error.textContent = missing.length ? "Please add " + missing.join(", ") + "." : "";
    if (missing.length) error.scrollIntoView({ behavior: "smooth", block: "center" });
    return !missing.length;
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = el("textarea", {}); ta.value = text; document.body.append(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    }
  }
  const go = url => { location.href = url; };
  const buttons = [];
  if (cfg.wa) buttons.push(["primary", "Send on WhatsApp", () => go(`https://wa.me/${cfg.wa}?text=${encodeURIComponent(message())}`)]);
  if (cfg.em) buttons.push([buttons.length ? "secondary" : "primary", buttons.length ? "Email" : "Send by email", () => go(`mailto:${cfg.em}?subject=${encodeURIComponent("Cake order")}&body=${encodeURIComponent(message())}`)]);
  if (cfg.ig) buttons.push([buttons.length ? "secondary" : "primary", buttons.length ? "Instagram" : "Send on Instagram", async () => { await copy(message()); toast("Order copied: paste it in the chat"); setTimeout(() => go("https://ig.me/m/" + cfg.ig), 900); }]);
  if (cfg.fb && !/^https?:/i.test(cfg.fb)) buttons.push(["secondary", "Messenger", async () => { await copy(message()); toast("Order copied: paste it in the chat"); setTimeout(() => go("https://m.me/" + cfg.fb.replace(/\s+/g, "")), 900); }]);
  buttons.push([buttons.length ? "secondary" : "primary", buttons.length ? "Copy" : "Copy order", async () => { toast(await copy(message()) ? "Order copied" : "Could not copy"); }]);
  $("#sendbtns").replaceChildren(...buttons.map(([kind, label, fn]) => el("button", { type: "button", class: "btn " + kind, onclick: () => { if (check()) fn(); } }, label)));
  $("#sendbar").hidden = false;
  window.cakeOrderMessage = message; // for testing
  update();
}

readConfig().then(cfg => {
  if (!cfg) throw new Error("no settings");
  start(cfg);
}).catch(() => {
  $("#app").replaceChildren(el("div", { class: "empty" },
    el("h1", {}, "🎂"),
    el("p", {}, "This order form link is incomplete. Please ask the bakery to send it again."),
  ));
});
</script>
